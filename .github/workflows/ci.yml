name: coilEM public candidate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      performance_acceptance_only:
        description: 'Run only the Windows Standard-map and Performance export acceptance (#139/#142)'
        type: boolean
        default: false
      performance_recheck_run:
        description: 'Optional prior cold-run ID: reuse its native maps for Windows UI/export checks'
        type: string
        default: ''
      performance_examples_json:
        description: 'Optional JSON array of regular example IDs; blank runs all five'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Every manual acceptance dispatch is independent, including cold runs.
  group: public-candidate-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}${{ inputs.performance_acceptance_only && format('-performance-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !inputs.performance_acceptance_only && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.select.outputs.runtime }}
      frontend: ${{ steps.select.outputs.frontend }}
      browser: ${{ steps.select.outputs.browser }}
      native: ${{ steps.select.outputs.native }}
      audit: ${{ steps.select.outputs.audit }}
      runtime_matrix: ${{ steps.select.outputs.runtime_matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Select checks from the complete local diff
        id: select
        run: python -m tools.ci_plan

  snapshot:
    if: ${{ !inputs.performance_acceptance_only && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install 'pypdf>=5,<7' 'pillow>=13,<14' 'ruff>=0.1.0'
      - name: Verify the exported snapshot and publication contents
        # The public repository may not hold private benchmark evidence (tools/release/private_evidence.py).
        run: python tools/verify_snapshot.py --publication ${{ github.repository == 'coilemdev/coilem' && '--public-tree' || '' }}
      - name: Lint exported Python
        run: python -m ruff check backend tools tests

  runtime:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      COILEM_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - uses: ./.github/actions/rust-cache
        with:
          cache-group: runtime
      - name: Install Linux mesh system library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install the documented backend environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Build the bundled native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Test the native solver
        run: cargo test --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Run exported Python tests
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: python -m pytest -q tests -n 2 --dist loadfile
      - name: Exercise real native mesh and sinusoidal and six-step solves
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: python tools/smoke_public_runtime.py

  windows-cancellation:
    needs: changes
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Match the original invalid-handle failure (#234).
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install the documented backend environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Exercise late spawn, overlapping pools and cancellation
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-cancellation-ci
        run: >-
          python -m pytest -q tests/test_process_pool_cancellation.py
          tests/test_windows_field_frame_pool.py tests/test_windows_mesh_pool.py
          tests/test_field_frame_locality.py tests/test_field_frame_pipeline.py
          tests/test_parallel_fallback_solves.py tests/test_launcher_shutdown.py
          tests/test_solve_profile.py

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check contracts, types, and the production bundle
        working-directory: frontend
        run: npm run build
      - name: Audit locked frontend dependencies
        working-directory: frontend
        # Fails on any high or critical advisory not reviewed in audit-exceptions.json;
        # an exception lapses once a fix is published or its review date passes.
        run: npm run audit:deps

  public-browser:
    name: public-browser (${{ matrix.suite }})
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    # Each shard owns its backend; concurrent solves in one app are unsupported.
    # Tests within a serial describe block stay together. Local tests use one worker.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: release-workflows-1
            command: npx playwright test --config playwright.public.config.ts tests/public-release.spec.ts --shard=1/3
          - suite: release-workflows-2
            command: npx playwright test --config playwright.public.config.ts tests/public-release.spec.ts --shard=2/3
          - suite: release-workflows-3
            command: npx playwright test --config playwright.public.config.ts tests/public-release.spec.ts --shard=3/3
          - suite: progressive-design-1
            command: npx playwright test --config playwright.public.config.ts tests/progressive-design.spec.ts --shard=1/2
          - suite: progressive-design-2
            command: npx playwright test --config playwright.public.config.ts tests/progressive-design.spec.ts --shard=2/2 && npx playwright test --config playwright.performance-harness.config.ts
          - suite: solve-profiles
            command: npx playwright test --config playwright.public.config.ts tests/solve-profiles.spec.ts tests/thermal.spec.ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/rust-cache
      - name: Install native mesh system library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install the public backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Build the native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install browser test tools
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise real Standard motor workflows in Chromium
        working-directory: frontend
        run: ${{ matrix.command }}
      - name: Retain browser timings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-browser-timings-${{ matrix.suite }}
          retention-days: 7
          path: frontend/test-results/public-release.json
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-browser-diagnostics-${{ matrix.suite }}
          retention-days: 7
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/trace.zip
            frontend/test-results/**/error-context.md
            frontend/test-results/public-release.json

  dependency-audit:
    needs: changes
    if: ${{ needs.changes.outputs.audit == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Audit exact Python requirements
        # pip-audit skips pins whose markers do not match its interpreter, so
        # audit each supported Python's pins with the markers removed.
        run: |
          python -m pip install pip-audit
          python -m tools.release.policy --audit-pins "$RUNNER_TEMP/audit"
          for pins in "$RUNNER_TEMP"/audit/pins-*.txt; do
            echo "Auditing $(basename "$pins")"
            pip-audit -r "$pins" --no-deps --disable-pip
          done
      - uses: ./.github/actions/rust-cache
        with:
          cache-group: audit
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file solvers/magneto2d/Cargo.lock

  native-tests:
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-cache
        with:
          cache-group: tests
      - name: Test the exported native solver
        run: cargo test --locked --manifest-path solvers/magneto2d/Cargo.toml

  performance-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_acceptance_only }}
    runs-on: windows-latest
    # 120 min per test, with setup/build/upload headroom outside Playwright.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(inputs.performance_examples_json || '["spm-8p12s", "ipm-14p-flat", "ipm-10p-v", "spm-24p", "spm-6p36s"]') }}
    env:
      COILEM_BUILD_COMMIT: ${{ github.sha }}
      COILEM_ACCEPTANCE_CASES: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the public backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Build the native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Build the production UI and install Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install chromium
      - name: Run a cold Standard map and inspect the Performance view
        if: ${{ !inputs.performance_recheck_run }}
        working-directory: frontend
        run: npx playwright test --config playwright.performance.config.ts
      - name: Download the measured native map for a UI/export recheck
        if: ${{ inputs.performance_recheck_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          COLD_RUN_ID: ${{ inputs.performance_recheck_run }}
        run: gh run download "$env:COLD_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "performance-windows-$env:COILEM_ACCEPTANCE_CASES" --dir frontend/test-results/cold-evidence
      - name: Recheck the UI and downloads with the measured map
        if: ${{ inputs.performance_recheck_run }}
        working-directory: frontend
        env:
          COILEM_ACCEPTANCE_RECHECK_DIR: test-results/cold-evidence/performance-evidence
        run: npx playwright test --config playwright.performance.config.ts
      - name: Verify downloaded PDF and CSV values
        env:
          EVIDENCE_FOLDER: ${{ inputs.performance_recheck_run && 'performance-recheck-evidence' || 'performance-evidence' }}
        run: python -m tools.check_performance_acceptance "frontend/test-results/$env:EVIDENCE_FOLDER/$env:COILEM_ACCEPTANCE_CASES"
      - name: Keep numerical map exports and diagnostics in private CI
        if: ${{ always() && github.repository == 'coilemdev/coilem-experiments' && github.event.repository.private == true }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: performance-windows-${{ matrix.example }}
          retention-days: 30
          path: |
            frontend/test-results/performance-evidence/
            frontend/test-results/performance-recheck-evidence/
            frontend/test-results/performance-acceptance/
            frontend/test-results/performance-acceptance.json
            frontend/test-results/performance-run.json

  qualification-evidence:
    name: qualification evidence required
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Check the frozen public A-F records and package inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from backend.resources import benchmark_data_files
          from tools.release.private_evidence import is_public_definition

          frozen = "52184f8bbdf7e94aa0901bba5bdb127a430b11a9"
          allowed = set(benchmark_data_files(Path.cwd())) | {
              "benchmarks/README.md", "benchmarks/records/README.md", "benchmarks/af-v1.11-sector/README.md",
          }
          changes = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", frozen, "--", "benchmarks", "docs/benchmarks", "docs/qualification"],
              text=True,
          ).splitlines()
          # The definitions of the benchmarks added after the public A-F record (specification, fixtures,
          # requests, gates, protocol documents) are public; their generated records are not, and stay refused.
          unexpected = sorted(path for path in set(changes) - allowed if not is_public_definition(path))
          if unexpected:
              raise SystemExit("Public benchmark publication is paused. Unexpected files: " + ", ".join(unexpected))
          PY
