name: coilEM public candidate

on:
  push:
    branches: [main, release/v0.5.1]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      windows_cancel_probe_only:
        description: Run only the repeated Windows interrupt investigation
        type: boolean
        default: false
      windows_cancel_probe_entrypoint:
        description: Compare the installed console wrapper with direct Python
        type: choice
        options: [console, python]
        default: console
      windows_cancel_probe_stage:
        description: Real solve stage to interrupt
        type: choice
        options: [noload_sweep, magneto2d_sweep]
        default: noload_sweep
      windows_cancel_probe_attempts:
        description: Independent launcher attempts per Python version
        default: '8'
      qualification_base:
        description: 'Trusted base SHA for CI after an evidence publication commit'
        type: string
        default: ''
      performance_acceptance_only:
        description: 'Run only the Windows Standard-map and Performance export acceptance (#139/#142)'
        type: boolean
        default: false
      performance_recheck_run:
        description: 'Optional prior cold-run ID: reuse its native maps for Windows UI/export checks'
        type: string
        default: ''
      performance_examples_json:
        description: 'Optional JSON array of regular example IDs; blank runs all five'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Every manual acceptance dispatch is independent, including cold runs.
  group: public-candidate-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}${{ inputs.performance_acceptance_only && format('-performance-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  runtime:
    if: ${{ !inputs.windows_cancel_probe_only && (!inputs.performance_acceptance_only) }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (#79).
        os: [windows-latest, macos-latest, ubuntu-24.04]
        python: ['3.11']
        # The newest supported Python installs its own pins; see requirements.lock.
        include:
          - os: ubuntu-24.04
            python: '3.15'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      COILEM_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux mesh system library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install the documented backend environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify the exported snapshot and publication contents
        run: python tools/verify_snapshot.py --publication
      - name: Build the bundled native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Lint exported Python
        run: python -m ruff check backend tools tests
      - name: Test the native solver
        run: cargo test --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Run exported Python tests
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: python -m pytest -q tests
      - name: Exercise real native mesh and sinusoidal and six-step solves
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: python tools/smoke_public_runtime.py
      - name: Exercise the A B C D benchmark command without FEMM
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: >-
          python -m tools.run_benchmarks --phases A B C D
          --case spm_4p12s_simple__baseline
          --case ipm_flat_4p12s_micro_contract
          --case spm_8p24s_distributed_femm_validation
          --case spm_4p12s_small --smoke
          --out-dir "${{ runner.temp }}/coilem-abcd-smoke" --pdf

  windows-cancellation:
    if: ${{ !inputs.windows_cancel_probe_only && (!inputs.performance_acceptance_only) }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Match the original invalid-handle failure (#234).
          python-version: '3.12.10'
      - name: Install the documented backend environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Exercise late spawn, overlapping pools and cancellation
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-cancellation-ci
        run: >-
          python -m pytest -q tests/test_process_pool_cancellation.py
          tests/test_windows_field_frame_pool.py tests/test_windows_mesh_pool.py
          tests/test_field_frame_locality.py tests/test_field_frame_pipeline.py
          tests/test_parallel_fallback_solves.py tests/test_launcher_shutdown.py
          tests/test_solve_profile.py

  frontend:
    if: ${{ !inputs.windows_cancel_probe_only && (!inputs.performance_acceptance_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check contracts, types, and the production bundle
        working-directory: frontend
        run: npm run build
      - name: Audit locked frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  public-browser:
    name: public-browser (${{ matrix.suite }})
    if: ${{ !inputs.windows_cancel_probe_only && (!inputs.performance_acceptance_only) }}
    runs-on: ubuntu-24.04
    # The suite ran about 36 minutes as one job; two shards each start their own
    # backend, since the app solves one motor at a time. `npm run test:browser`
    # still runs the whole suite locally.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: release-workflows
            command: npx playwright test --config playwright.public.config.ts tests/public-release.spec.ts
          - suite: design-and-harness
            command: npx playwright test --config playwright.public.config.ts tests/progressive-design.spec.ts && npx playwright test --config playwright.performance-harness.config.ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native mesh system library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install the public backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Build the native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Install browser test tools
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise real Standard motor workflows in Chromium
        working-directory: frontend
        run: ${{ matrix.command }}
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-browser-diagnostics-${{ matrix.suite }}
          retention-days: 7
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/trace.zip
            frontend/test-results/**/error-context.md
            frontend/test-results/public-release.json

  dependency-audit:
    if: ${{ !inputs.windows_cancel_probe_only && (!inputs.performance_acceptance_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Audit exact Python requirements
        # pip-audit skips pins whose markers do not match its interpreter, so
        # audit each supported Python's pins with the markers removed.
        run: |
          python -m pip install pip-audit
          python -m tools.release.policy --audit-pins "$RUNNER_TEMP/audit"
          for pins in "$RUNNER_TEMP"/audit/pins-*.txt; do
            echo "Auditing $(basename "$pins")"
            pip-audit -r "$pins" --no-deps --disable-pip
          done
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file solvers/magneto2d/Cargo.lock

  native-tests:
    if: ${{ !inputs.windows_cancel_probe_only && (!inputs.performance_acceptance_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the exported native solver
        run: cargo test --locked --manifest-path solvers/magneto2d/Cargo.toml

  performance-acceptance:
    if: ${{ !inputs.windows_cancel_probe_only && (github.event_name == 'workflow_dispatch' && inputs.performance_acceptance_only) }}
    runs-on: windows-latest
    # 120 min per test, with setup/build/upload headroom outside Playwright.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(inputs.performance_examples_json || '["spm-8p12s", "ipm-14p-flat", "ipm-10p-v", "spm-24p", "spm-6p36s"]') }}
    env:
      COILEM_BUILD_COMMIT: ${{ github.sha }}
      COILEM_ACCEPTANCE_CASES: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the public backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Build the native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Build the production UI and install Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install chromium
      - name: Run a cold Standard map and inspect the Performance view
        if: ${{ !inputs.performance_recheck_run }}
        working-directory: frontend
        run: npx playwright test --config playwright.performance.config.ts
      - name: Download the measured native map for a UI/export recheck
        if: ${{ inputs.performance_recheck_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          COLD_RUN_ID: ${{ inputs.performance_recheck_run }}
        run: gh run download "$env:COLD_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "performance-windows-$env:COILEM_ACCEPTANCE_CASES" --dir frontend/test-results/cold-evidence
      - name: Recheck the UI and downloads with the measured map
        if: ${{ inputs.performance_recheck_run }}
        working-directory: frontend
        env:
          COILEM_ACCEPTANCE_RECHECK_DIR: test-results/cold-evidence/performance-evidence
        run: npx playwright test --config playwright.performance.config.ts
      - name: Verify downloaded PDF and CSV values
        env:
          EVIDENCE_FOLDER: ${{ inputs.performance_recheck_run && 'performance-recheck-evidence' || 'performance-evidence' }}
        run: python -m tools.check_performance_acceptance "frontend/test-results/$env:EVIDENCE_FOLDER/$env:COILEM_ACCEPTANCE_CASES"
      - name: Keep timings, screenshots, exports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: performance-windows-${{ matrix.example }}
          retention-days: 30
          path: |
            frontend/test-results/performance-evidence/
            frontend/test-results/performance-recheck-evidence/
            frontend/test-results/performance-acceptance/
            frontend/test-results/performance-acceptance.json
            frontend/test-results/performance-run.json

  qualification-impact:
    permissions:
      contents: read
      actions: read
    if: ${{ !inputs.windows_cancel_probe_only && (github.event_name == 'pull_request' || inputs.qualification_base) }}
    runs-on: ubuntu-24.04
    outputs:
      physics_change: ${{ steps.impact.outputs.physics_change }}
      measurement_required: ${{ steps.impact.outputs.measurement_required }}
      reuse_run_id: ${{ steps.impact.outputs.reuse_run_id }}
      collection_state: ${{ steps.impact.outputs.collection_state }}
      measurement_candidate: ${{ steps.impact.outputs.measurement_candidate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.qualification_base }}
        run: python -m tools.physics_impact --base "$BASE_SHA" --plan

  qualification-evidence:
    name: qualification evidence required
    # One-time owner-approved integration exception: #190 is benchmarked from
    # its exact main merge commit. Runtime and release qualification stay intact.
    if: ${{ !inputs.windows_cancel_probe_only && ((github.event_name == 'pull_request' && github.event.pull_request.number != 190) || inputs.qualification_base) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.qualification_base }}
        run: python -m tools.physics_impact --base "$BASE_SHA"

  qualification-measure:
    permissions:
      contents: read
      actions: read
    needs: qualification-impact
    if: ${{ !inputs.windows_cancel_probe_only && (needs.qualification-impact.outputs.measurement_required == 'true' && !github.event.pull_request.draft && github.event.pull_request.number != 190) }}
    uses: ./.github/workflows/release-benchmarks.yml
    with:
      candidate: ${{ github.event.pull_request.head.sha }}

  qualification-label:
    needs: qualification-impact
    if: ${{ !inputs.windows_cancel_probe_only && (needs.qualification-impact.outputs.physics_change == 'true' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Identify physics changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create physics-change --color D93F0B --description "Requires measured qualification evidence" --force
          gh pr edit "$PR_NUMBER" --add-label physics-change

  qualification-publication:
    needs: [qualification-impact, qualification-measure]
    if: ${{ !inputs.windows_cancel_probe_only && (always() && github.event.pull_request.number != 190 && needs.qualification-impact.outputs.physics_change == 'true' && github.event.pull_request.head.repo.full_name == github.repository && (needs.qualification-measure.result == 'success' || needs.qualification-impact.outputs.collection_state == 'complete')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      # Execute tooling from the trusted PR base. Candidate Python code never
      # runs in this job; credentials are only provided to the final push step.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/requirements.lock
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: benchmark-joined-*
          run-id: ${{ needs.qualification-impact.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/measured
      - name: Compare both platforms against previous and owner-approved evidence
        working-directory: automation
        run: >-
          python -m tools.qualification_carry --root ../candidate --baseline .
          --windows "$RUNNER_TEMP/measured/benchmark-joined-windows-2022"
          --macos "$RUNNER_TEMP/measured/benchmark-joined-macos-15"
          --out "$RUNNER_TEMP/prepared"
      - name: Apply verified compact evidence and recheck qualification
        working-directory: automation
        env:
          CANDIDATE_SHA: ${{ needs.qualification-impact.outputs.measurement_candidate || github.event.pull_request.head.sha }}
        run: >-
          python -m tools.qualification_publish --root ../candidate
          --publication "$RUNNER_TEMP/prepared/publication" --candidate "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: qualification-publication-review
          path: ${{ runner.temp }}/prepared
          retention-days: 90
      - name: Commit matching measured records and run CI on the publication commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh auth setup-git
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate config core.hooksPath /dev/null
          git -C candidate add benchmarks snapshot-manifest.json
          git -C candidate commit -m 'Publish matching measured qualification evidence'
          git -C candidate push origin "HEAD:$PR_BRANCH"
          gh workflow run ci.yml --ref "$PR_BRANCH" -f qualification_base="$BASE_SHA"

  windows-cancel-probe:
    if: ${{ inputs.windows_cancel_probe_only }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Repeat the real interrupted solve, preserving every failure
        env:
          PROBE_ATTEMPTS: ${{ inputs.windows_cancel_probe_attempts }}
          PROBE_ENTRYPOINT: ${{ inputs.windows_cancel_probe_entrypoint }}
          PROBE_STAGE: ${{ inputs.windows_cancel_probe_stage }}
        run: python -m tools.windows_cancel_probe --out "$env:RUNNER_TEMP/cancel-probe" --attempts "$env:PROBE_ATTEMPTS" --stage "$env:PROBE_STAGE" --entrypoint "$env:PROBE_ENTRYPOINT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-cancel-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/cancel-probe/attempt-*/result.json
            ${{ runner.temp }}/cancel-probe/attempt-*/launcher.txt
            ${{ runner.temp }}/cancel-probe/attempt-*/traceback.txt
