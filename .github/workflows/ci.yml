name: coilEM public candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (#79).
        os: [windows-latest, macos-latest, ubuntu-24.04]
        python: ['3.11']
        # The newest supported Python installs its own pins; see requirements.lock.
        include:
          - os: ubuntu-24.04
            python: '3.15'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      COILEM_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux mesh system library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install the documented backend environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify the exported snapshot and publication contents
        run: python tools/verify_snapshot.py --publication
      - name: Build the bundled native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Lint exported Python
        run: python -m ruff check backend tools tests
      - name: Test the native solver
        run: cargo test --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Run exported Python tests
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: python -m pytest -q tests
      - name: Exercise real native mesh and sinusoidal and six-step solves
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: python tools/smoke_public_runtime.py
      - name: Exercise the A B C D benchmark command without FEMM
        env:
          COILEM_USER_DATA_ROOT: ${{ runner.temp }}/coilem-public-ci
        run: >-
          python -m tools.run_benchmarks --phases A B C D
          --case spm_4p12s_simple__baseline
          --case ipm_flat_4p12s_micro_contract
          --case spm_8p24s_distributed_femm_validation
          --case spm_4p12s_small --smoke
          --out-dir "${{ runner.temp }}/coilem-abcd-smoke" --pdf

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check contracts, types, and the production bundle
        working-directory: frontend
        run: npm run build
      - name: Audit locked frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native mesh system library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install the public backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
      - name: Build the native solver
        run: cargo build --release --locked --manifest-path solvers/magneto2d/Cargo.toml
      - name: Install browser test tools
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise real Standard motor workflows in Chromium
        working-directory: frontend
        run: npm run test:browser
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-browser-diagnostics
          retention-days: 7
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/trace.zip
            frontend/test-results/**/error-context.md
            frontend/test-results/public-release.json

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Audit exact Python requirements
        # pip-audit skips pins whose markers do not match its interpreter, so
        # audit each supported Python's pins with the markers removed.
        run: |
          python -m pip install pip-audit
          python -m tools.release.policy --audit-pins "$RUNNER_TEMP/audit"
          for pins in "$RUNNER_TEMP"/audit/pins-*.txt; do
            echo "Auditing $(basename "$pins")"
            pip-audit -r "$pins" --no-deps --disable-pip
          done
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file solvers/magneto2d/Cargo.lock

  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the exported native solver
        run: cargo test --locked --manifest-path solvers/magneto2d/Cargo.toml
