name: coilEM release wheels

# Builds one py3-none-<platform> wheel per supported platform, checks it, and
# runs the installed-package acceptance test on every platform and supported
# Python version. A manual run with `publish: testpypi` then uploads the wheels
# to TestPyPI as a unique .devN rehearsal version and repeats the acceptance
# test against the TestPyPI install. Only a pushed vX.Y.Z tag that matches the
# package version uploads to PyPI, after every acceptance job passes and a
# reviewer approves the `pypi` environment; the acceptance test then runs
# against the PyPI install and the wheels go to a draft GitHub release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the wheels after every check passes
        type: choice
        options: [none, testpypi]
        default: none
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release-wheels.yml
      - setup.py
      - pyproject.toml
      - requirements.lock
      - backend/launcher.py
      - backend/resources.py
      - tools/release/**
      - solvers/magneto2d/Cargo.toml
      - solvers/magneto2d/Cargo.lock
      - frontend/package-lock.json

permissions:
  contents: read

concurrency:
  group: release-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.0"
  NODE_VERSION: "24"
  BUILD_PYTHON: "3.12"
  COILEM_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # TestPyPI never accepts a version twice; rehearsals publish <version>.dev<run><attempt>.
  COILEM_VERSION_SUFFIX: ${{ inputs.publish == 'testpypi' && format('.dev{0}{1}', github.run_id, github.run_attempt) || '' }}

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Compatibility policy
    runs-on: ubuntu-24.04
    outputs:
      policy: ${{ steps.policy.outputs.policy }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: Resolve the package version; a release tag must match it
        id: version
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then args=(--tag "$GITHUB_REF_NAME"); fi
          version=$(python -m tools.release.version "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
      - run: python -m pip install packaging
      - name: Compute platform floors from the pinned runtime wheels
        id: policy
        run: python -m tools.release.policy --github-output "$GITHUB_OUTPUT"

  ui:
    name: UI bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: Build the production bundle once for every wheel
        run: python -m tools.release.artifacts ui --out dist/release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui
          path: |
            dist/release/ui
            dist/release/ui.build.json
          if-no-files-found: error

  magneto2d:
    name: Magneto2D (${{ matrix.target }})
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: macos-arm64
            triple: aarch64-apple-darwin
            runner: macos-15
          - target: macos-x86_64
            triple: x86_64-apple-darwin
            runner: macos-15-intel
          - target: windows-amd64
            triple: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_POLICY: ${{ toJSON(fromJSON(needs.policy.outputs.policy)[matrix.target]) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build in the manylinux image at or below the glibc floor
        if: matrix.target == 'linux-x86_64'
        run: |
          image=$(python3 -c 'import json, os; print(json.loads(os.environ["TARGET_POLICY"])["build_image"])')
          docker run --rm -v "$PWD":/io -w /io -e RUST_TOOLCHAIN "$image" bash -euo pipefail -c '
            git config --global --add safe.directory /io
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
            export PATH="$HOME/.cargo/bin:$PATH"
            /opt/python/cp312-cp312/bin/python -m tools.release.artifacts magneto2d \
              --target ${{ matrix.triple }} --out dist/release/magneto2d'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.target != 'linux-x86_64'
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: Build with the pinned toolchain
        if: matrix.target != 'linux-x86_64'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.triple }}
          rustup default "$RUST_TOOLCHAIN"
          deployment_target=$(python -c 'import json, os; print(json.loads(os.environ["TARGET_POLICY"]).get("macosx_deployment_target", ""))')
          python -m tools.release.artifacts magneto2d --target ${{ matrix.triple }} --out dist/release/magneto2d \
            ${deployment_target:+--macos-deployment-target "$deployment_target"}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: magneto2d-${{ matrix.target }}
          path: dist/release/magneto2d
          if-no-files-found: error

  wheel:
    name: Wheel (${{ matrix.target }})
    needs: [policy, ui, magneto2d]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            executable: magneto2d
          - target: macos-arm64
            runner: macos-15
            executable: magneto2d
          - target: macos-x86_64
            runner: macos-15-intel
            executable: magneto2d
          - target: windows-amd64
            runner: windows-2022
            executable: magneto2d.exe
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORM_TAG: ${{ fromJSON(needs.policy.outputs.policy)[matrix.target].platform_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui
          path: dist/release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: magneto2d-${{ matrix.target }}
          path: dist/release/magneto2d
      - name: Package the prebuilt UI and binary
        env:
          COILEM_BUILD_UI_DIST: dist/release/ui
          COILEM_BUILD_MAGNETO2D_BINARY: dist/release/magneto2d/${{ matrix.executable }}
          COILEM_WHEEL_PLATFORM_TAG: ${{ env.PLATFORM_TAG }}
        run: python -m pip wheel . --no-deps --wheel-dir dist/wheels
      - name: Check metadata, contents and build identity
        run: |
          python -m pip install packaging
          python -m tools.release.verify_wheel dist/wheels/*.whl --platform-tag "$PLATFORM_TAG" --require-commit
      - name: Check native dependencies (auditwheel)
        if: matrix.target == 'linux-x86_64'
        run: |
          python -m pip install auditwheel
          auditwheel show dist/wheels/*.whl
          python -m tools.release.native_deps dist/wheels/*.whl
      - name: Check native dependencies (delocate)
        if: startsWith(matrix.target, 'macos')
        run: |
          python -m pip install delocate
          external=$(delocate-listdeps dist/wheels/*.whl)
          if [ -n "$external" ]; then echo "non-system libraries: $external"; exit 1; fi
          python -m tools.release.native_deps dist/wheels/*.whl
      - name: Check native dependencies (dumpbin)
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $env:PATH = "$($dumpbin.DirectoryName);$env:PATH"
          $wheel = Get-ChildItem dist\wheels\*.whl | Select-Object -First 1
          python -m tools.release.native_deps $wheel.FullName
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheel-${{ matrix.target }}
          path: dist/wheels/*.whl
          if-no-files-found: error

  acceptance:
    name: Acceptance (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, macos-arm64, macos-x86_64, windows-amd64]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # The oldest supported OS that has a hosted runner.
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-amd64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: tools/release/acceptance.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ matrix.target }}
          path: wheels
      - name: Report a missing GLU library at startup
        if: matrix.target == 'linux-x86_64' && matrix.python == '3.12'
        run: |
          if ldconfig -p | grep -q 'libGLU.so.1'; then echo "GLU is preinstalled on this image; skipping"; exit 0; fi
          python -m venv "$RUNNER_TEMP/glu-check"
          "$RUNNER_TEMP/glu-check/bin/python" -m pip install --quiet wheels/*.whl
          if "$RUNNER_TEMP/glu-check/bin/coilem" --no-browser 2> "$RUNNER_TEMP/glu.err"; then echo "coilem started without GLU"; exit 1; fi
          cat "$RUNNER_TEMP/glu.err"
          grep -q "sudo apt-get install libglu1-mesa" "$RUNNER_TEMP/glu.err"
      - name: Install the documented Linux libraries
        if: matrix.target == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libx11-6 libxcursor1 libxext6 libxfixes3 libxft2 libxinerama1 libxrender1 libfontconfig1 libgomp1
      - name: Run the installed-package acceptance test outside the checkout
        run: |
          wheel=$(python -c 'import glob, os; print(os.path.abspath(glob.glob("wheels/*.whl")[0]))')
          cp tools/release/acceptance.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -I acceptance.py --install "$wheel"

  acceptance-bare-linux:
    # The hosted images already have every library Gmsh loads, so the jobs
    # above cannot catch a gap in the documented list (#77). Start from a bare
    # container, check that coilem names the packages to install, then install
    # exactly those and run the acceptance test.
    name: Acceptance (bare ubuntu:22.04 container, Python 3.12)
    needs: wheel
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The container has no git, so checkout downloads the tree through the API.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-linux-x86_64
          path: wheels
      # Ubuntu 22.04's own python3.11 is a 3.11.0 release candidate, which does
      # not satisfy coilEM's Requires-Python; uv brings a standalone build.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Python 3.12, and procps for the acceptance test's process checks
        run: |
          uv python install 3.12
          echo "PYTHON=$(uv python find 3.12)" >> "$GITHUB_ENV"
          apt-get update
          apt-get install -y --no-install-recommends procps
      - name: Report every package to install when Gmsh cannot load
        run: |
          "$PYTHON" -m venv "$RUNNER_TEMP/bare"
          "$RUNNER_TEMP/bare/bin/python" -m pip install --quiet wheels/*.whl
          if timeout 120 "$RUNNER_TEMP/bare/bin/coilem" --no-browser 2> "$RUNNER_TEMP/missing.err"; then echo "coilem started without Gmsh's libraries"; exit 1; fi
          cat "$RUNNER_TEMP/missing.err"
          grep -qF "sudo apt-get install libglu1-mesa libgl1 libx11-6 libxcursor1 libxext6 libxfixes3 libxft2 libxinerama1 libxrender1 libfontconfig1 libgomp1" "$RUNNER_TEMP/missing.err"
      - name: Install only the Linux libraries the README documents
        run: apt-get install -y --no-install-recommends libglu1-mesa libgl1 libx11-6 libxcursor1 libxext6 libxfixes3 libxft2 libxinerama1 libxrender1 libfontconfig1 libgomp1
      - name: Run the installed-package acceptance test outside the checkout
        run: |
          wheel=$(ls "$PWD"/wheels/*.whl)
          cp tools/release/acceptance.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$PYTHON" -I acceptance.py --install "$wheel"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [policy, acceptance, acceptance-bare-linux]
    if: inputs.publish == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/coilem/${{ needs.policy.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check that every platform's wheel has the rehearsal version
        env:
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 4
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in "coilem-$VERSION-py3-none-"*) ;; *) echo "unexpected wheel: $wheel"; exit 1 ;; esac
          done
      - name: Upload with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-acceptance:
    name: TestPyPI install (${{ matrix.target }})
    needs: [policy, publish-testpypi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-amd64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: tools/release/acceptance.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ matrix.target }}
          path: wheels
      - name: Install the documented Linux libraries
        if: matrix.target == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libx11-6 libxcursor1 libxext6 libxfixes3 libxft2 libxinerama1 libxrender1 libfontconfig1 libgomp1
      - name: Install from TestPyPI and run the acceptance test
        env:
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          built=$(python -c 'import glob, hashlib; print(hashlib.sha256(open(glob.glob("wheels/*.whl")[0], "rb").read()).hexdigest())')
          cp tools/release/acceptance.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -I acceptance.py --install "coilem==$VERSION" --index-url https://test.pypi.org/simple/ --expect-sha256 "$built"

  publish-pypi:
    name: Publish to PyPI
    needs: [policy, acceptance, acceptance-bare-linux]
    # Only a pushed release tag; the policy job has checked that it names the version.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/coilem/${{ needs.policy.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check that every platform's wheel has the release version
        env:
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 4
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in "coilem-$VERSION-py3-none-"*) ;; *) echo "unexpected wheel: $wheel"; exit 1 ;; esac
          done
      - name: Upload with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  pypi-acceptance:
    name: PyPI install (${{ matrix.target }})
    needs: [policy, publish-pypi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-amd64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: tools/release/acceptance.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ matrix.target }}
          path: wheels
      - name: Install the documented Linux libraries
        if: matrix.target == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libx11-6 libxcursor1 libxext6 libxfixes3 libxft2 libxinerama1 libxrender1 libfontconfig1 libgomp1
      - name: Install from PyPI and run the acceptance test
        env:
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          built=$(python -c 'import glob, hashlib; print(hashlib.sha256(open(glob.glob("wheels/*.whl")[0], "rb").read()).hexdigest())')
          cp tools/release/acceptance.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -I acceptance.py --install "coilem==$VERSION" --index-url https://pypi.org/simple/ --expect-sha256 "$built"

  github-release:
    name: Attach the wheels to a draft GitHub release
    needs: [policy, pypi-acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            RELEASE_NOTES.md
            tools/release/release_notes.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Create or update the draft release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
          else
            # A release page has no repository context: make relative links absolute (#79).
            python3 -I tools/release/release_notes.py RELEASE_NOTES.md --repo "$GH_REPO" --ref "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" dist/*.whl --draft --verify-tag \
              --title "coilEM $VERSION Developer Preview" --notes-file "$RUNNER_TEMP/notes.md"
          fi
