[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "coilem"
description = "Local, open-source motor design with Magneto2D and optional Elmer analysis"
readme = "README.md"
# Every supported version must have wheels for all locked runtime pins; see
# tools/release/policy.py, which checks this.
requires-python = ">=3.11,<3.16"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "coilEM contributors" },
]
# setup.py takes the version from backend/__init__.py (see
# tools/release/version.py). The audited runtime lock is the dependency list:
# an installed coilEM gets exactly the versions that were reviewed and tested.
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://coilem.com"
Repository = "https://github.com/coilemdev/coilem"

[project.optional-dependencies]
dev = [
    "httpx>=0.24.0,<1",
    "pypdf>=5,<7",
    "pytest>=7.0,<10",
    "ruff>=0.1.0",
]

[project.scripts]
coilem = "backend.launcher:main"
coilem-serve = "backend.public_main:start"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.lock"] }

[tool.setuptools.packages.find]
include = ["backend*"]

# setup.py also copies the schemas, the M350-50A curve, the built UI and the
# Magneto2D binary into wheels; see backend/resources.py.
[tool.setuptools.package-data]
backend = ["elmer/profiles/*.json", "mesh_profiles/*.json", "reference_models/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
markers = [
    "pr: lightweight regression coverage",
    "weekly: extended native mesh coverage",
]
